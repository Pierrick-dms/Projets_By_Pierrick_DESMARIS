<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mes Projets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0c;
        --surface: #19191c;
        --surface-2: #232327;
        --border: rgba(255, 255, 255, 0.08);
        --border-soft: rgba(255, 255, 255, 0.05);
        --text: #f2f2f0;
        --text-soft: #98989d;
        --green: #32d74b;
        --yellow: #ffd60a;
        --red: #ff5f57;
        --radius-lg: 20px;
        --radius-md: 14px;
        --radius-sm: 10px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          Helvetica, Arial, sans-serif;
        color: var(--text);
        max-width: 1000px;
        margin: 0 auto;
        padding: 48px 20px 90px;
        background: var(--bg);
        background-image:
          radial-gradient(
            circle at 15% 0%,
            rgba(50, 215, 75, 0.06),
            transparent 45%
          ),
          radial-gradient(
            circle at 100% 20%,
            rgba(255, 214, 10, 0.05),
            transparent 40%
          );
        min-height: 100vh;
      }

      h1 {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 4px;
      }

      .subtitle {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        color: var(--text-soft);
        margin: 0 0 24px;
      }

      .subtitle span {
        color: var(--green);
      }

      /* Icône fixe en haut à gauche pour revenir à l'accueil */
      .home-icon-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--surface);
        border: 1px solid var(--border);
        display: none;
        align-items: center;
        justify-content: center;
        color: var(--green);
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
        transition:
          transform 0.12s ease,
          border-color 0.12s ease,
          color 0.12s ease;
        z-index: 50;
        padding: 0;
        margin: 0;
      }

      .home-icon-btn:hover {
        transform: translateY(-2px);
        border-color: var(--green);
        color: var(--yellow);
      }

      .home-icon-btn:active {
        transform: scale(0.95);
      }

      /* ---------- Page d'accueil : bulles positionnées précisément ---------- */
      :root {
        --bubble-base: clamp(110px, 22vw, 160px);
      }

      .home-view {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 24px;
      }

      .home-hint {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        color: var(--text-soft);
        margin-bottom: 12px;
      }

      /* Scène : les bulles et la case s'y positionnent en absolu */
      .home-stage {
        position: relative;
        width: 100%;
        height: 55vh;
        min-height: 340px;
        transition: height 0.2s ease;
      }

      .home-stage.expanded-mode {
        height: 62vh;
        min-height: 380px;
      }

      .bubble {
        position: absolute;
        top: 50%;
        width: var(--bubble-base);
        height: var(--bubble-base);
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 16px;
        text-align: center;
        cursor: pointer;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        transition:
          left 0.25s ease,
          width 0.25s ease,
          height 0.25s ease,
          transform 0.15s ease,
          box-shadow 0.15s ease,
          border-color 0.15s ease;
      }

      /* Position neutre : 1/3 et 2/3 de la largeur, centrées en hauteur */
      .bubble.pos-a {
        left: 33.333%;
        transform: translate(-50%, -50%);
      }
      .bubble.pos-b {
        left: 66.666%;
        transform: translate(-50%, -50%);
      }

      .bubble:hover {
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
      }

      .bubble.projects:hover {
        border-color: var(--green);
        box-shadow: 0 14px 32px rgba(50, 215, 75, 0.18);
      }

      .bubble.todo:hover {
        border-color: var(--yellow);
        box-shadow: 0 14px 32px rgba(255, 214, 10, 0.18);
      }

      .bubble-icon {
        font-size: 32px;
      }

      .bubble-label {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
      }

      .bubble-count {
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        color: var(--text-soft);
        letter-spacing: 0.02em;
      }

      /* Position agrandie : à gauche, centrée en hauteur, diamètre x2.5 */
      .bubble.expanded {
        left: 10%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: calc(var(--bubble-base) * 2.5);
        height: calc(var(--bubble-base) * 2.5);
      }

      .bubble.expanded .bubble-icon {
        font-size: 52px;
      }
      .bubble.expanded .bubble-label {
        font-size: 17px;
      }
      .bubble.expanded .bubble-count {
        font-size: 12px;
      }

      /* Case aperçu : centrée sur le centre vertical de la bulle, remplit l'espace restant */
      .preview-panel {
        position: absolute;
        top: 50%;
        left: calc(20% + (var(--bubble-base) * 1.25) + 28px);
        right: 24px;
        height: 74%;
        transform: translateY(-50%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 18px 20px;
        overflow-y: auto;
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.35);
      }

      .preview-panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-soft);
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
      }

      .preview-close {
        background: none;
        border: none;
        color: var(--text-soft);
        cursor: pointer;
        font-size: 12px;
        padding: 0;
        margin: 0;
      }

      .preview-close:hover {
        color: var(--red);
      }

      .preview-item {
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface-2);
        margin-top: 8px;
        font-size: 13px;
      }

      .preview-item:first-child {
        margin-top: 0;
      }

      .preview-item-title {
        display: block;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 2px;
      }

      .preview-item-sub {
        color: var(--text-soft);
        font-size: 12px;
      }

      /* Sur petit écran, la mise en page en 1/3-2/3 + agrandissement x2.5
           devient impraticable : on repasse en empilement vertical simple */
      @media (max-width: 480px) {
        .home-stage,
        .home-stage.expanded-mode {
          height: auto;
          min-height: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 16px;
          padding: 12px 0 20px;
        }

        .bubble,
        .bubble.pos-a,
        .bubble.pos-b,
        .bubble.expanded {
          position: static;
          left: auto;
          top: auto;
          transform: none;
        }

        .preview-panel {
          position: static;
          left: auto;
          right: auto;
          top: auto;
          transform: none;
          width: 100%;
          height: auto;
          max-height: 320px;
        }
      }

      /* ---------- fenêtre macOS ---------- */
      .window {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }

      .window-bar {
        display: flex;
        gap: 8px;
        padding: 18px 30px;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border-soft);
        align-items: center;
      }

      .dot {
        width: 12px;
        height: 12px;
        border: none;
        border-radius: 50%;
        padding: 0;
        display: block;
        cursor: pointer;
      }
      .dot.red {
        background: var(--red);
      }
      .dot.yellow {
        background: var(--yellow);
      }
      .dot.green {
        background: var(--green);
      }

      form {
        padding: 20px;
      }

      label {
        display: block;
        margin-top: 14px;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-soft);
      }

      .window {
        transition:
          width 0.3s ease,
          height 0.3s ease;
      }

      .window.small {
        width: 110px;
        height: 44px;
        border-radius: 25px;
        overflow: hidden;
      }

      .window.small .window-bar {
        height: 100%;
        padding: 0px 12px;
        border-bottom: none;
        align-items: center;
      }

      .window.medium {
        width: 100%;
        height: auto;
      }

      .window.large {
        position: fixed;
        top: 20px;
        left: 20px;
        right: 20px;
        bottom: 20px;
        width: 100%;
        height: 100%;
        border-radius: 0;
        z-index: 100;
      }

      label:first-of-type {
        margin-top: 0;
      }

      input,
      textarea {
        width: 100%;
        padding: 11px 14px;
        margin-top: 6px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-family: inherit;
        font-size: 14px;
        background: var(--surface-2);
        color: var(--text);
        box-sizing: border-box;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      input::placeholder,
      textarea::placeholder {
        color: #5c5c60;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(50, 215, 75, 0.18);
      }

      textarea {
        min-height: 70px;
        resize: vertical;
      }

      button {
        margin-top: 18px;
        padding: 11px 22px;
        background: var(--green);
        color: #06210c;
        border: none;
        border-radius: 999px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        transition:
          filter 0.15s ease,
          transform 0.1s ease;
      }

      button:hover {
        filter: brightness(1.1);
      }
      button:active {
        transform: scale(0.97);
      }
      button:focus-visible {
        outline: 2px solid var(--yellow);
        outline-offset: 2px;
      }

      #projectlist {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .empty-state {
        text-align: center;
        padding: 36px 16px;
        color: var(--text-soft);
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        border: 1px dashed var(--border);
        border-radius: var(--radius-lg);
      }

      .project-card {
        background: var(--surface);
        padding: 16px 18px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        transition:
          transform 0.12s ease,
          border-color 0.12s ease,
          box-shadow 0.12s ease;
      }

      .project-card:hover {
        transform: translateY(-2px);
        border-color: rgba(50, 215, 75, 0.35);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      .project-card h3 {
        margin: 0 0 4px;
        font-size: 15px;
        color: var(--text);
      }

      .project-card p {
        margin: 0;
        color: var(--text-soft);
        font-size: 13px;
        line-height: 1.4;
      }

      .project-card .del-btn {
        margin-top: 0;
        flex-shrink: 0;
        background: var(--surface-2);
        color: var(--text-soft);
        border: 1px solid var(--border);
        width: 26px;
        height: 26px;
        padding: 0;
        border-radius: 50%;
        font-size: 12px;
        line-height: 1;
      }

      .project-card .del-btn:hover {
        background: var(--red);
        color: #2a0805;
        border-color: var(--red);
      }

      #listView .window-bar,
      #detailView .window-bar,
      #todoView .window-bar {
        justify-content: space-between;
        align-items: center;
      }

      .back-btn {
        background: none;
        border: none;
        color: var(--yellow);
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        padding: 0 0 0 4px;
        margin: 0;
        cursor: pointer;
      }

      .back-btn:hover {
        text-decoration: underline;
      }

      #detailView .window-body,
      #todoView .window-body {
        padding: 20px;
      }

      #detailName {
        font-size: 20px;
        margin: 0 0 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      .field-block {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 16px 18px;
        margin-top: 14px;
      }

      .field-block label {
        margin-top: 0;
      }
      .field-block textarea {
        background: var(--surface);
      }

      /* Terminal look for sensor frames — mirrors macOS Terminal.app */
      #detailTrames {
        background: #060706;
        color: var(--green);
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        min-height: 120px;
        border: 1px solid #000;
        border-radius: var(--radius-sm);
        caret-color: var(--green);
      }

      #detailTrames::placeholder {
        color: #2e5a38;
      }
      #detailTrames:focus {
        box-shadow: 0 0 0 3px rgba(50, 215, 75, 0.22);
        border-color: var(--green);
      }

      #detailView button[onclick="saveDetail()"] {
        background: var(--yellow);
        color: #2b2400;
      }

      #detailTentatives {
        width: 100%;
        padding: 11px 14px;
        margin-top: 6px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        background: var(--surface);
        color: var(--text);
        -webkit-appearance: none;
        appearance: none;
      }

      /* ---------- To-do list domotique ---------- */
      #todoView h2 {
        font-size: 20px;
        margin: 0 0 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      #todoForm {
        padding: 0;
        margin-top: 16px;
      }

      #todoList {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .todo-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
      }

      .todo-check {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        cursor: pointer;
      }

      /* rond Fait / non fait, cliquable */
      .todo-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        flex-shrink: 0;
        border: 2px solid var(--text-soft);
        background: transparent;
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }

      .todo-dot.done {
        background: var(--green);
        border-color: var(--green);
      }

      .todo-done {
        text-decoration: line-through;
        color: var(--text-soft);
      }
    </style>
  </head>
  <body>
    <button
      id="homeIconBtn"
      class="home-icon-btn"
      onclick="goHome()"
      aria-label="Retour à l'accueil"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 9.5L12 3l9 6.5" />
        <path d="M5 9.5V21h14V9.5" />
      </svg>
    </button>

    <h1>My Projects By Pierrick DESMARIS</h1>
    <p class="subtitle">
      carnet d'atelier — <span id="countLabel">0 projet</span>
    </p>

    <!-- ===== Page d'accueil ===== -->
    <div id="homeView" class="home-view">
      <p class="home-hint" id="homeHint">Que veux-tu ouvrir ?</p>

      <div class="home-stage" id="homeStage">
        <div
          class="bubble projects pos-a"
          id="bubbleProjects"
          onclick="handleProjectsBubbleClick()"
        >
          <span class="bubble-icon">🛠️</span>
          <span class="bubble-label">Projets<br />personnel</span>
          <span class="bubble-count" id="projectCount"></span>
        </div>
        <div
          class="bubble todo pos-b"
          id="bubbleTodo"
          onclick="handleTodoBubbleClick()"
        >
          <span class="bubble-icon">🏠</span>
          <span class="bubble-label">To-do list<br />domotique</span>
          <span class="bubble-count" id="todoCount"></span>
        </div>

        <div class="preview-panel" id="previewPanel" style="display: none">
          <div class="preview-panel-header">
            <span id="previewPanelTitle"></span>
            <button
              class="preview-close"
              onclick="collapseHome()"
              aria-label="Fermer l'aperçu"
            >
              ✕ fermer
            </button>
          </div>
          <div id="previewPanelList"></div>
        </div>
      </div>
    </div>

    <!-- ===== Vue liste des projets ===== -->
    <div id="listView" style="display: none">
      <div class="window">
        <div class="window-bar">
          <div style="display: flex; gap: 8px">
            <button
              class="dot red"
              onclick="resizeWindow(this, 'small')"
            ></button>
            <button
              class="dot yellow"
              onclick="resizeWindow(this, 'medium')"
            ></button>
            <button
              class="dot green"
              onclick="resizeWindow(this, 'large')"
            ></button>
          </div>
        </div>

        <div class="window-body">
          <form id="projectForm">
            <label for="pName">Nom du projet</label>
            <input
              type="text"
              id="pName"
              placeholder="Ex : capteur d'empreinte ESP32"
            />

            <label for="pDesc">Description</label>
            <textarea
              id="pDesc"
              placeholder="Ce que fait le projet ..."
            ></textarea>

            <button type="submit">+ Ajouter</button>
          </form>
        </div>
      </div>

      <div id="projectlist"></div>
    </div>

    <!-- ===== Vue détail d'un projet ===== -->
    <div id="detailView" style="display: none">
      <div class="window">
        <div class="window-bar">
          <button class="back-btn" onclick="backToList()">&larr; Retour</button>
          <span></span>
        </div>
        <div class="window-body">
          <h2 id="detailName"></h2>

          <div class="field-block">
            <label for="detailTentatives"> Tentative enregistrée</label>
            <select id="detailTentatives" size="5">
              <option>Chargement ...</option>
            </select>
          </div>

          <div class="field-block">
            <label for="detailTrames">Trames envoyées</label>
            <textarea
              id="detailTrames"
              placeholder="Trames reçues, valeurs capteurs, ..."
            ></textarea>
          </div>

          <button onclick="saveDetail()">Enregistrer</button>
        </div>
      </div>
    </div>

    <!-- ===== To-do list domotique ===== -->
    <div id="todoView" style="display: none">
      <div class="window">
        <div class="window-bar">
          <button class="back-btn" onclick="goHome()">&larr; Retour</button>
          <span></span>
        </div>
        <div class="window-body">
          <h2>To-do list domotique</h2>

          <div class="field-block">
            <label for="todoText">Nouvelle tâche</label>
            <form id="todoForm">
              <input
                type="text"
                id="todoText"
                placeholder="Ex : Ajouter capteur de présence salon"
              />
              <button type="submit">+ Ajouter</button>
            </form>
          </div>

          <div class="field-block">
            <label>Tâches</label>
            <div id="todoList"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("projectForm");
      const listDiv = document.getElementById("projectlist");
      const countLabel = document.getElementById("countLabel");

      let projects = JSON.parse(localStorage.getItem("projects")) || [];

      function escapeHTML(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function renderProjects() {
        listDiv.innerHTML = "";

        countLabel.textContent =
          projects.length === 0
            ? "0 projet"
            : projects.length + (projects.length > 1 ? " projets" : " projet");

        if (projects.length === 0) {
          listDiv.innerHTML =
            '<div class="empty-state">Aucun projet pour l\'instant — ajoute le premier ci-dessus.</div>';
          return;
        }

        projects.forEach(function (p, index) {
          const projectHTML = `
                <div class="project-card" onclick="openDetail(${index})">
                    <div>
                        <h3>${escapeHTML(p.name)}</h3>
                        <p>${escapeHTML(p.desc)}</p>
                    </div>
                    <button class="del-btn" onclick="event.stopPropagation(); deleteProject(${index})" aria-label="Supprimer">✕</button>
                </div>
                `;
          listDiv.innerHTML += projectHTML;
        });
      }

      let currentIndex = null;

      function openDetail(index) {
        currentIndex = index;
        const p = projects[index];

        document.getElementById("detailName").textContent = p.name;
        chargerTentatives();
        document.getElementById("detailTrames").value = p.trames || "";

        document.getElementById("listView").style.display = "none";
        document.getElementById("detailView").style.display = "block";
      }

      function saveDetail() {
        projects[currentIndex].trames =
          document.getElementById("detailTrames").value;

        localStorage.setItem("projects", JSON.stringify(projects));
        backToList();
      }

      function backToList() {
        document.getElementById("listView").style.display = "block";
        document.getElementById("detailView").style.display = "none";
      }

      function deleteProject(index) {
        projects.splice(index, 1);
        localStorage.setItem("projects", JSON.stringify(projects));
        renderProjects();
      }

      function chargerTentatives() {
        fetch("http://localhost:3000/tentatives")
          .then((response) => response.json())
          .then((data) => {
            const select = document.getElementById("detailTentatives");
            select.innerHTML = "<option> Aucune tentative enregistrée</option>";
            return;
          });
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const name = document.getElementById("pName").value.trim();
        const desc = document.getElementById("pDesc").value.trim();
        if (!name) return;

        projects.push({ name: name, desc: desc });

        localStorage.setItem("projects", JSON.stringify(projects));

        renderProjects();
        form.reset();
      });

      renderProjects();

      /* ===================================================
           Navigation entre la page d'accueil et les sections
           (ajouté — ne touche à aucune fonction existante)
        =================================================== */
      function goToProjects() {
        document.getElementById("homeView").style.display = "none";
        document.getElementById("listView").style.display = "block";
        document.getElementById("homeIconBtn").style.display = "flex";
      }

      function goToTodo() {
        document.getElementById("homeView").style.display = "none";
        document.getElementById("todoView").style.display = "block";
        document.getElementById("homeIconBtn").style.display = "flex";
        renderTodos();
      }

      function goHome() {
        document.getElementById("homeView").style.display = "flex";
        document.getElementById("listView").style.display = "none";
        document.getElementById("detailView").style.display = "none";
        document.getElementById("todoView").style.display = "none";
        document.getElementById("homeIconBtn").style.display = "none";
        collapseHome();
        updateHomeStats();
      }

      function updateHomeStats() {
        const projectCountEl = document.getElementById("projectCount");
        const todoCountEl = document.getElementById("todoCount");

        if (projectCountEl) {
          projectCountEl.textContent =
            projects.length === 0
              ? "aucun projet"
              : projects.length +
                (projects.length > 1 ? " projets" : " projet");
        }

        if (todoCountEl) {
          const pending = todos.filter(function (t) {
            return !t.done;
          }).length;
          todoCountEl.textContent =
            pending === 0
              ? "tout est fait"
              : pending +
                (pending > 1 ? " tâches restantes" : " tâche restante");
        }
      }

      /* ===================================================
           Bulle agrandie + case aperçu (premier clic),
           ouverture de la page complète (second clic)
        =================================================== */
      let homeExpanded = null; // null | 'projects' | 'todo'

      function handleProjectsBubbleClick() {
        if (homeExpanded === "projects") {
          goToProjects();
          return;
        }
        expandHome("projects");
      }

      function handleTodoBubbleClick() {
        if (homeExpanded === "todo") {
          goToTodo();
          return;
        }
        expandHome("todo");
      }

      function expandHome(which) {
        homeExpanded = which;

        const bubbleProjects = document.getElementById("bubbleProjects");
        const bubbleTodo = document.getElementById("bubbleTodo");
        const stage = document.getElementById("homeStage");
        const panel = document.getElementById("previewPanel");
        const panelTitle = document.getElementById("previewPanelTitle");
        const hint = document.getElementById("homeHint");

        stage.classList.add("expanded-mode");

        if (which === "projects") {
          bubbleTodo.style.display = "none";
          bubbleProjects.style.display = "flex";
          bubbleProjects.classList.add("expanded");
          panelTitle.textContent = "Projets personnel";
          renderPreviewProjects();
        } else {
          bubbleProjects.style.display = "none";
          bubbleTodo.style.display = "flex";
          bubbleTodo.classList.add("expanded");
          panelTitle.textContent = "To-do domotique";
          renderPreviewTodo();
        }

        panel.style.display = "block";
        hint.textContent = "Reclique sur la bulle pour l'ouvrir";
      }

      function collapseHome() {
        homeExpanded = null;

        document.getElementById("bubbleProjects").style.display = "flex";
        document.getElementById("bubbleTodo").style.display = "flex";
        document.getElementById("bubbleProjects").classList.remove("expanded");
        document.getElementById("bubbleTodo").classList.remove("expanded");
        document.getElementById("homeStage").classList.remove("expanded-mode");
        document.getElementById("previewPanel").style.display = "none";
        document.getElementById("homeHint").textContent =
          "Que veux-tu ouvrir ?";
      }

      function renderPreviewProjects() {
        const panelList = document.getElementById("previewPanelList");
        panelList.innerHTML = "";

        if (projects.length === 0) {
          panelList.innerHTML =
            '<div class="empty-state">Aucun projet pour l\'instant.</div>';
          return;
        }

        projects.forEach(function (p) {
          const item = document.createElement("div");
          item.className = "preview-item";
          item.innerHTML =
            '<span class="preview-item-title">' +
            escapeHTML(p.name) +
            "</span>" +
            '<span class="preview-item-sub">' +
            escapeHTML(p.desc) +
            "</span>";
          panelList.appendChild(item);
        });
      }

      function renderPreviewTodo() {
        const panelList = document.getElementById("previewPanelList");
        panelList.innerHTML = "";

        if (todos.length === 0) {
          panelList.innerHTML =
            '<div class="empty-state">Aucune tâche pour l\'instant.</div>';
          return;
        }

        todos.forEach(function (t) {
          const item = document.createElement("div");
          item.className = "preview-item";
          item.innerHTML =
            '<span class="todo-dot ' +
            (t.done ? "done" : "") +
            '" style="display:inline-block; margin-right:8px; vertical-align:middle;"></span>' +
            '<span class="' +
            (t.done ? "todo-done" : "") +
            '">' +
            escapeHTML(t.text) +
            "</span>";
          panelList.appendChild(item);
        });
      }

      /* ===================================================
           To-do list domotique (nouvelle fonctionnalité,
           indépendante des projets — même logique, autre clé)
        =================================================== */
      const todoForm = document.getElementById("todoForm");
      const todoListDiv = document.getElementById("todoList");

      let todos = JSON.parse(localStorage.getItem("todos")) || [];

      function renderTodos() {
        todoListDiv.innerHTML = "";

        if (todos.length === 0) {
          todoListDiv.innerHTML =
            '<div class="empty-state">Aucune tâche pour l\'instant.</div>';
          return;
        }

        todos.forEach(function (t, index) {
          const todoHTML = `
                <div class="todo-item">
                    <div class="todo-check" onclick="toggleTodo(${index})">
                        <span class="todo-dot ${t.done ? "done" : ""}" title="${t.done ? "Fait" : "Non fait"}"></span>
                        <span class="${t.done ? "todo-done" : ""}">${escapeHTML(t.text)}</span>
                    </div>
                    <button class="del-btn" onclick="event.stopPropagation(); deleteTodo(${index})" aria-label="Supprimer">✕</button>
                </div>
                `;
          todoListDiv.innerHTML += todoHTML;
        });
      }

      function toggleTodo(index) {
        todos[index].done = !todos[index].done;
        localStorage.setItem("todos", JSON.stringify(todos));
        renderTodos();
      }

      function deleteTodo(index) {
        todos.splice(index, 1);
        localStorage.setItem("todos", JSON.stringify(todos));
        renderTodos();
      }

      function resizeWindow(button, size) {
        // Récupère la fenêtre concernée
        const window = button.closest(".window");

        // Supprime les anciennes tailles
        window.classList.remove("small", "medium", "large");

        // Ajoute la nouvelle taille
        window.classList.add(size);
      }

      todoForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const text = document.getElementById("todoText").value.trim();
        if (!text) return;

        todos.push({ text: text, done: false });
        localStorage.setItem("todos", JSON.stringify(todos));

        renderTodos();
        todoForm.reset();
      });

      document.addEventListener("click", function (event) {
        event.target.closest(".bubble");
        if (event.target.closest(".bubble") === null && homeExpanded !== null) {
          collapseHome();
        }
      });

      updateHomeStats();
    </script>
  </body>
</html>
